# Opens Inbox and waits until the shared card's note is just its host: that means status `ready`,
# set only by the server's extract, so the item made the round trip (pending cards say "fetching…").
# An article read of the page would add its minutes, hence the optional `N min · `.
appId: com.prathamesh.hang
---
# Home's "Recently saved" label opens the Inbox; it's there once the share has left an item unsorted.
- extendedWaitUntil:
    visible:
      id: inbox
    timeout: 10000
- tapOn:
    id: inbox
- repeat:
    times: 12
    while:
      notVisible:
        id: ${URL_PATTERN}
        containsChild:
          text: (\d+ min · )?example\.com
    commands:
      - swipe:
          direction: DOWN
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    id: ${URL_PATTERN}
    containsChild:
      text: (\d+ min · )?example\.com
