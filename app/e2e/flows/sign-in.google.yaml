# Real Google sign-in with the test account already on the device.
# Swap this file for an email sign-in subflow to run against a local stack (see #22).
# On the phone a tap right after a fresh install's launch can be lost (no picker, no error; a cancelled
# picker looks the same), so let the app settle and re-tap while the sign-in button is still there.
# Google may skip the picker and sign straight in with the account it remembers, so tap the account
# only if it's offered.
appId: com.prathamesh.hang
---
- extendedWaitUntil:
    visible:
      id: sign-in-google
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 3
    while:
      visible:
        id: sign-in-google
    commands:
      - tapOn:
          id: sign-in-google
      - extendedWaitUntil:
          visible: ${ACCOUNT}
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible: ${ACCOUNT}
          commands:
            - tapOn: ${ACCOUNT}
      - extendedWaitUntil:
          visible:
            id: home-greeting
          timeout: 20000
          optional: true
# Home: the greeting is always there, whatever the account holds.
- extendedWaitUntil:
    visible:
      id: home-greeting
    timeout: 30000
