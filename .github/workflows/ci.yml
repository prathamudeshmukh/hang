# Tests on every push to main and on PRs. On main, deploys what changed under supabase/ once the tests pass:
# migrations first, then functions, then the app to Play internal testing (#25). Runtime secrets (EXTRACT_SECRET,
# Vault) are set by hand, never here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Releases the app from main without a new commit.
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DENO_VERSION: "2.9.6"
  SUPABASE_CLI_VERSION: "3.1.0"
  SUPABASE_PROJECT_REF: ffofgzyudtloekityjfw
  # Services the tests don't use. Realtime, storage, auth, PostgREST and Kong stay up; the functions'
  # integration script serves its own edge runtime.
  SUPABASE_START_EXCLUDE: studio,imgproxy,mailpit,logflare,vector,supavisor,postgres-meta,edge-runtime

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # A change to this file re-runs both deploys: db push is a no-op without new migrations.
      migrations: ${{ steps.filter.outputs.migrations == 'true' || steps.filter.outputs.workflow == 'true' }}
      functions: ${{ steps.filter.outputs.functions == 'true' || steps.filter.outputs.workflow == 'true' }}
      app: >-
        ${{ steps.filter.outputs.app == 'true' || steps.filter.outputs.links == 'true'
        || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v4
      # A manual run has nothing to compare against; release-android doesn't read these outputs then.
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'
            functions:
              - 'supabase/functions/**'
              - '!supabase/functions/**/*.test.ts'
              - '!supabase/functions/**/*.integration.ts'
              - '!supabase/functions/scripts/**'
            app:
              - 'app/**'
              - '!app/**/*.test.ts'
              - '!app/**/*.test.js'
              - '!app/**/*.integration.ts'
              - '!app/e2e/**'
            links:
              - 'supabase/functions/_shared/links/**'
              - '!supabase/functions/**/*.test.ts'
            workflow:
              - '.github/workflows/ci.yml'
          predicate-quantifier: every

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      # Global install so the scripts' `npx supabase` resolves to this pinned version.
      - name: Supabase CLI
        run: |
          npm install -g "supabase@$SUPABASE_CLI_VERSION"
          npx supabase --version

      - name: App — install
        working-directory: app
        run: npm ci
      - name: App — typecheck
        working-directory: app
        run: npm run typecheck
      - name: App — lint
        working-directory: app
        run: npm run lint
      - name: App — unit tests with coverage
        working-directory: app
        run: npm run test:coverage

      - name: Functions — typecheck
        working-directory: supabase/functions
        run: deno task check
      - name: Functions — lint
        working-directory: supabase/functions
        run: deno lint
      - name: Functions — unit tests with coverage
        working-directory: supabase/functions
        run: deno task test:coverage

      - name: Local stack — start
        run: npx supabase start -x "$SUPABASE_START_EXCLUDE"
      - name: Database — pgTAP
        run: npx supabase test db
      - name: Functions — integration
        working-directory: supabase/functions
        run: deno task test:integration
      - name: App — integration
        working-directory: app
        run: npm run test:integration

  migrate:
    needs: [changes, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # CLI 3.x: db push is local unless --remote; hosted changes need --yes in a non-interactive run.
      - name: Plan
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --password="$SUPABASE_DB_PASSWORD" --dry-run
      - name: Push
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --password="$SUPABASE_DB_PASSWORD" --yes

  deploy-functions:
    needs: [changes, test, migrate]
    # Runs after migrate, or when migrate was skipped; never after a failed migrate.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.test.result == 'success' && needs.changes.outputs.functions == 'true'
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-functions
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase functions deploy --remote="$SUPABASE_PROJECT_REF" --yes

  # Builds the AAB signed with the Play upload key and puts it on the internal track; the Play Store updates the
  # phone. Runs after the backend it may need, never after a failed deploy. versionCode is the commit count on main.
  release-android:
    needs: [changes, test, migrate, deploy-functions]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.test.result == 'success'
      && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.outputs.app == 'true'))
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
      && (needs.deploy-functions.result == 'success' || needs.deploy-functions.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: release-android
      cancel-in-progress: false
    env:
      AAB: app/android/app/build/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release settings
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          missing=""
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD PLAY_ACCOUNT SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_WEB_CLIENT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Release settings missing from the production environment:$missing"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: gradle/actions/setup-gradle@v4

      - name: Version and release notes
        run: |
          echo "HANG_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/whatsnew"
          git log -1 --format=%s | cut -c1-500 > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "HANG_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Install
        working-directory: app
        run: npm ci
      - name: Prebuild
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Build
        working-directory: app/android
        env:
          HANG_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          HANG_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          HANG_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew bundleRelease
      # Built but empty or debug-signed is the failure the tests can't see.
      - name: Check the bundle
        run: |
          unzip -l "$AAB" | grep -q 'base/assets/index.android.bundle' || { echo "::error::No JS bundle in the AAB"; exit 1; }
          if keytool -printcert -jarfile "$AAB" | grep -q 'CN=Android Debug'; then
            echo "::error::The AAB is signed with the debug key"; exit 1
          fi

      # A re-run of a commit that already shipped fails here with "version code already used": nothing new to send.
      - name: Upload to internal testing
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.prathamesh.hang
          releaseFiles: ${{ env.AAB }}
          track: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
