<title>Empty Home Layouts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="lavish-design" content="off">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Five ways to lay out the how-to on the feature wall, each a Home screen at 1 css px = 1 dp, B3 drawings, Sage room tokens. */
:root{--bench:#D3DACF;--card:#EDF0EA;--wall:#EDF0EA;--deep:#E2E7DE;--raised:#F9FAF6;--ink:#151D18;--ink-2:#46524A;--ink-3:#5A665E;--rule:#D6DCD2;
  --blk:rgba(21,29,24,.11);--blk2:rgba(21,29,24,.24);--sheet:#FFFFFF;--tap:rgba(21,29,24,.10);--wash:#B9CFC9;--wash2:#8FB0A8;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;--sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bench:#0A0D0B;--card:#121714;--wall:#161C18;--deep:#111612;--raised:#202823;--ink:#E6ECE6;--ink-2:#AAB6AD;--ink-3:#8F9C92;--rule:#323C35;
  --blk:rgba(230,236,230,.12);--blk2:rgba(230,236,230,.26);--sheet:#2B342E;--tap:rgba(230,236,230,.14);--wash:#2E4A45;--wash2:#3F6A62;color-scheme:dark}}
:root[data-theme="dark"]{--bench:#0A0D0B;--card:#121714;--wall:#161C18;--deep:#111612;--raised:#202823;--ink:#E6ECE6;--ink-2:#AAB6AD;--ink-3:#8F9C92;--rule:#323C35;
  --blk:rgba(230,236,230,.12);--blk2:rgba(230,236,230,.26);--sheet:#2B342E;--tap:rgba(230,236,230,.14);--wash:#2E4A45;--wash2:#3F6A62;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bench);color:var(--ink);font-family:var(--sans);padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{max-width:1320px;margin:0 auto}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,44px);letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
.lede{color:var(--ink-2);max-width:720px;margin:8px 0 0;line-height:1.5;font-size:15px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.controls button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--ink-3);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
.controls button[aria-pressed="true"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.controls button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.grid{display:flex;flex-wrap:wrap;gap:28px 24px;margin:24px auto 0;max-width:1320px;justify-content:center}
.mock{width:412px;max-width:100%;display:flex;flex-direction:column;gap:10px}
.mock header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mock h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;line-height:1.1}
.mock .tag{font-size:12px;font-weight:700;color:#C23B20;letter-spacing:.02em}
.mock p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.45}
.screen{border-radius:30px;border:8px solid #1B201D;overflow:hidden;background:var(--wall)}
.fw{background:var(--deep);padding:28px 16px 18px}
.date{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.35;color:var(--ink-2)}
.greet{font-family:var(--serif);font-size:40px;line-height:1;letter-spacing:-1.2px;margin-top:6px}
.label{font-family:var(--serif);font-size:18px;line-height:1.2;margin:18px 0 10px}
.cap{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.35;color:var(--ink-2);margin-top:6px}
.cap .sub{color:var(--ink-3)}
.art{display:block;width:100%;height:auto;border-radius:2px;background:var(--raised)}
.lower{padding:4px 16px 26px}
.section{font-family:var(--serif);font-size:18px;margin-top:16px}
.row{display:flex;align-items:center;gap:12px;margin-top:10px;min-height:48px}
.cover{width:40px;height:40px;border-radius:2px;border:1px dashed var(--ink-3);flex:none}
.action{font-size:15px;font-weight:500;color:var(--ink-3)}
/* 1 Row */
.l-row{display:flex;gap:10px}.l-row > div{flex:1 1 0;min-width:0}
/* 2 Masonry */
.l-mason{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.l-mason .col{display:flex;flex-direction:column;gap:10px;min-width:0}
/* 3 Hero */
.chain{font-family:var(--serif);font-size:15px;line-height:1.4;color:var(--ink-2);margin:-2px 0 10px}
.chain i{color:var(--ink)}
/* 4 Labels */
.l-stack{display:flex;flex-direction:column;gap:12px}
.l-stack .step{display:flex;gap:14px;align-items:center}
.l-stack .step > svg{width:88px;flex:none}
.l-stack .name{font-family:var(--serif);font-size:18px;line-height:1.2}
.l-stack .note{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.35;color:var(--ink-2);margin-top:2px}
/* 5 Peek */
.l-peek{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-right:-16px;padding-right:16px;scrollbar-width:none}
.l-peek > div{flex:0 0 72%;scroll-snap-align:start;min-width:0}
.dots{display:flex;gap:6px;margin-top:10px}.dots span{width:6px;height:6px;border-radius:50%;background:var(--blk2)}.dots span:first-child{background:var(--ink)}
@media (prefers-reduced-motion: reduce){.l-peek{scroll-behavior:auto}}
</style>

<div class="top">
  <h1>Empty Home: five layouts</h1>
  <p class="lede">Same B3 drawings (the teal picture travels from page to share sheet; Hang's mark is the only other colour), five ways to hang them on the feature wall. Each is a real-size Home screen; scroll the peek one sideways.</p>
  <div class="controls" role="group" aria-label="Theme">
    <button type="button" id="theme-light" aria-pressed="false">Light</button>
    <button type="button" id="theme-dark" aria-pressed="false">Dark</button>
  </div>
</div>
<div class="grid" id="grid"></div>

<script>
const MARK = '<rect x="0" y="0" width="150" height="170" rx="10" fill="#D9A441"/><rect x="0" y="186" width="150" height="134" rx="10" fill="#2F7F7A"/><rect x="166" y="0" width="154" height="110" rx="10" fill="#2E4A7D"/><rect x="166" y="126" width="154" height="194" rx="10" fill="#C23B20"/>';
const mark = (cx, cy, size) => `<g transform="translate(${cx - size / 2} ${cy - size / 2}) scale(${size / 320})">${MARK}</g>`;
function shareGlyph(cx, cy, r, color, w) {
  const a = [cx + r * .55, cy - r * .7], b = [cx - r * .65, cy], c = [cx + r * .55, cy + r * .7], d = r * .28;
  return `<g stroke="${color}" fill="${color}" stroke-width="${w}"><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/><line x1="${b[0]}" y1="${b[1]}" x2="${c[0]}" y2="${c[1]}"/><circle cx="${a[0]}" cy="${a[1]}" r="${d}"/><circle cx="${b[0]}" cy="${b[1]}" r="${d}"/><circle cx="${c[0]}" cy="${c[1]}" r="${d}"/></g>`;
}
const halo = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r * 1.6}" fill="var(--tap)"/>`;
const picture = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="var(--wash)"/><path d="M${x} ${y + h} L${x + w * .3} ${y + h * .45} L${x + w * .47} ${y + h * .7} L${x + w * .64} ${y + h * .38} L${x + w} ${y + h} Z" fill="var(--wash2)"/><circle cx="${x + w * .8}" cy="${y + h * .24}" r="${Math.min(w, h) * .1}" fill="var(--wash2)"/>`;
const svgOf = (w, h, body, label) => `<svg class="art" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${body}</svg>`;

/** Every drawing is laid out from its own size, so one set of art fits all five layouts. */
function page(w, h, { o = 1, share = false } = {}) {
  const m = Math.min(w, h) * .09, s = m * 1.1, pw = w - 2 * m, py = m * 2 + s, ph = (h - py) * .55;
  const hy = py + ph + m;
  return `<g opacity="${o}"><rect x="${m}" y="${m}" width="${s}" height="${s}" rx="2" fill="var(--blk2)"/>${share ? '' : `<circle cx="${w - m - s / 2}" cy="${m + s / 2}" r="${s / 2}" fill="var(--blk2)"/>`}${picture(m, py, pw, ph)}<rect x="${m}" y="${hy}" width="${pw * .75}" height="${m * .8}" rx="2" fill="var(--blk2)"/><rect x="${m}" y="${hy + m * 1.5}" width="${pw * .55}" height="${m * .5}" rx="${m * .25}" fill="var(--blk)"/></g>`;
}
function shareStep(w, h) {
  const m = Math.min(w, h) * .09, s = m * 1.1, r = Math.min(w, h) * .1, cx = w - m - s / 2, cy = m + s / 2 + r * .3;
  return page(w, h, { o: .45, share: true }) + halo(cx, cy, r) + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--ink)"/>` + shareGlyph(cx, cy, r * .52, 'var(--raised)', r * .12);
}
function sheetStep(w, h) {
  const top = h * .44, m = Math.min(w, h) * .09, rest = h - top;
  const r = Math.min(w * .085, rest * .17), cy = top + rest * .68;
  const xs = [.17, .39, .61, .83].map((f) => w * f);
  const disc = (x, i) => i === 1
    ? halo(x, cy, r) + `<circle cx="${x}" cy="${cy}" r="${r}" fill="var(--wall)" stroke="var(--blk2)" stroke-width=".8"/>` + mark(x, cy, r * 1.1)
    : i === 3 ? `<circle cx="${x}" cy="${cy}" r="${r}" fill="var(--blk)"/><g fill="var(--ink-2)">${[-1, 0, 1].map((k) => `<circle cx="${x + k * r * .38}" cy="${cy}" r="${r * .12}"/>`).join('')}</g>`
    : `<circle cx="${x}" cy="${cy}" r="${r}" fill="var(--blk2)"/>`;
  const ty = top + rest * .14, th = rest * .2, tw = th * 1.3;
  return `<rect width="${w}" height="${h}" fill="var(--blk)"/>` + page(w, h, { o: .3 }) +
    `<path d="M0 ${h} V${top + 10} Q0 ${top} 10 ${top} H${w - 10} Q${w} ${top} ${w} ${top + 10} V${h}" fill="var(--sheet)"/><rect x="${w / 2 - 10}" y="${top + 5}" width="20" height="3" rx="1.5" fill="var(--blk2)"/>${picture(m, ty, tw, th)}<rect x="${m + tw + m * .8}" y="${ty + th * .12}" width="${w * .4}" height="${th * .28}" rx="${th * .14}" fill="var(--ink-3)"/><rect x="${m + tw + m * .8}" y="${ty + th * .58}" width="${w * .26}" height="${th * .22}" rx="${th * .11}" fill="var(--blk2)"/>` + xs.map(disc).join('');
}
const STEPS = [
  { draw: page, label: 'Step 1 of 3, open anything', cap: 'open anything', name: 'Open anything', note: 'A page, a video, a post: whatever you’re looking at.' },
  { draw: shareStep, label: 'Step 2 of 3, tap Share', cap: 'tap Share', name: 'Tap Share', note: 'Usually in the top bar, or behind ⋮.' },
  { draw: sheetStep, label: 'Step 3 of 3, pick Hang. It may be under More', cap: 'pick Hang', sub: 'it may be under More', name: 'Pick Hang', note: 'It may be under More.' },
];
const art = (i, w, h) => svgOf(w, h, STEPS[i].draw(w, h), STEPS[i].label);
const cap = (i) => `<div class="cap" aria-hidden="true">${STEPS[i].cap}${STEPS[i].sub ? `<br><span class="sub">${STEPS[i].sub}</span>` : ''}</div>`;
const HEAD = '<div class="label">Things get here from other apps.</div>';

const LAYOUTS = [
  { name: 'Row', note: 'Round 2’s B3 at full wall width: three equal 4:5 prints. The baseline.',
    wall: () => HEAD + `<div class="l-row">${[0, 1, 2].map((i) => `<div>${art(i, 120, 150)}${cap(i)}</div>`).join('')}</div>` },
  { name: 'Masonry', tag: 'recommended', note: 'Hung like the mark: steps 1 and 2 stacked on the left, the share sheet tall on the right. Each panel is about twice the area of the row’s, and it already looks like a wall.',
    wall: () => HEAD + `<div class="l-mason"><div class="col"><div>${art(0, 180, 128)}${cap(0)}</div><div>${art(1, 180, 128)}${cap(1)}</div></div><div class="col"><div>${art(2, 180, 284)}${cap(2)}</div></div></div>` },
  { name: 'One moment', note: 'Only step 3 is drawn, big; steps 1 and 2 are a line of words above it. Least to read, but it skips showing the Share button.',
    wall: () => HEAD + `<div class="chain"><i>Open anything</i>, tap <i>Share</i>, then pick <i>Hang</i>. It may be under More.</div>${art(2, 380, 230)}` },
  { name: 'Wall labels', note: 'A column of three square prints, each with a label beside it like a museum caption. Room for a line of help per step; the tallest, and it adds new copy.',
    wall: () => HEAD + `<div class="l-stack">${[0, 1, 2].map((i) => `<div class="step">${art(i, 96, 96)}<div><div class="name">${STEPS[i].name}</div><div class="note">${STEPS[i].note}</div></div></div>`).join('')}</div>` },
  { name: 'Peek', note: 'Large 4:5 prints in a strip that bleeds off the edge and scrolls, like Recently saved. The next step peeks in; one at a time is the most legible, but steps 2 and 3 are off-screen at first.',
    wall: () => HEAD + `<div class="l-peek">${[0, 1, 2].map((i) => `<div>${art(i, 240, 300)}${cap(i)}</div>`).join('')}</div><div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>` },
];
const LOWER = '<div class="lower"><div class="section">Collections</div><div class="row"><div class="cover"></div><div class="action">New collection</div></div></div>';
document.getElementById('grid').innerHTML = LAYOUTS.map((l, n) => `<section class="mock"><header><h2>${n + 1} · ${l.name}</h2>${l.tag ? `<span class="tag">${l.tag}</span>` : ''}</header><p>${l.note}</p><div class="screen"><div class="fw"><div class="date">Thursday, 19 November</div><div class="greet">Good evening</div>${l.wall()}</div>${LOWER}</div></section>`).join('');

const press = (on) => ['theme-light', 'theme-dark'].forEach((id) => document.getElementById(id).setAttribute('aria-pressed', String(id === on)));
document.getElementById('theme-light').addEventListener('click', () => { document.documentElement.setAttribute('data-theme', 'light'); press('theme-light'); });
document.getElementById('theme-dark').addEventListener('click', () => { document.documentElement.setAttribute('data-theme', 'dark'); press('theme-dark'); });
</script>
