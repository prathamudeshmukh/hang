<!doctype html><html><head><meta charset="utf-8"><title>Subtitles</title><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,350;1,6..72,400&family=Hanken+Grotesk:wght@600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;background:#0B0B0A}
body{font-family:'Newsreader',serif;color:#F2EFE8;position:relative}
.counter{position:absolute;top:18px;right:18px;font-style:italic;font-size:13px;color:rgba(242,239,232,.64)}
.note{font-style:italic;font-size:13px;line-height:18px;color:rgba(242,239,232,.64)}
.pills{position:absolute;left:18px;right:18px;bottom:30px;display:flex;gap:8px}
.pill{font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:15px;line-height:18px;padding:13px 22px;border-radius:999px;border:1px solid rgba(242,239,232,.28)}
.pill.filled{background:#F2EFE8;color:#0B0B0A;border-color:#F2EFE8}
.window{background:radial-gradient(ellipse 30% 18% at 70% 38%,rgba(255,196,120,.85),transparent 70%),radial-gradient(ellipse 18% 10% at 30% 55%,rgba(255,170,90,.6),transparent 70%),linear-gradient(180deg,#141a2b 0%,#1d2440 45%,#2b2230 70%,#0f0d12 100%)}
.bg{position:absolute;inset:0}
.shade{position:absolute;left:0;right:0;bottom:0;height:430px;background:linear-gradient(180deg,transparent,rgba(11,11,10,.72) 45%,rgba(11,11,10,.92))}
.top{position:absolute;top:18px;left:18px}
.sub{position:absolute;left:24px;right:24px;bottom:136px;text-align:center}
.cue{font-style:italic;font-size:15px;line-height:20px;color:rgba(242,239,232,.72);margin-bottom:10px}
.line{font-size:24px;line-height:32px;letter-spacing:-.005em}
.beat{margin-top:14px;font-style:italic;font-size:13px;color:rgba(242,239,232,.6)}
</style></head><body><div class="bg window"></div><div class="shade"></div>
<p class="note top">post · yesterday</p><div class="counter">4 of 12</div>
<div class="sub"><p class="cue">Tom Hale</p><p class="line">Night trains are back because airports got worse, not because trains got better.</p><p class="beat">1 of 3 · tap for more</p></div>
<div class="pills"><span class="pill filled">Move</span><span class="pill">Open</span></div></body></html>
