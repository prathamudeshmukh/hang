# After uninstall + reinstall: allowBackup is off, so the item can only come back through sync.
# Env (from run.sh): URL, URL_PATTERN, ACCOUNT, DEVICE, ROOM.
appId: com.prathamesh.hang
name: Still there after reinstall
---
- launchApp
- runFlow: sign-in.google.yaml
- runFlow: wait-until-synced.yaml
- runFlow: open-feed.yaml
- runFlow: back-to-shown.yaml
- runFlow: rediscover.yaml
# Last: it takes the run's item out of the Inbox, which everything above relies on.
- runFlow: share-into-new-room.yaml
