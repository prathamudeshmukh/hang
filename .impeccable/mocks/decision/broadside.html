<!doctype html><html><head><meta charset="utf-8"><title>Broadside</title><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,350;1,6..72,400&family=Hanken+Grotesk:wght@600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;background:#0B0B0A}
body{font-family:'Newsreader',serif;color:#F2EFE8;position:relative}
.counter{position:absolute;top:18px;right:18px;font-style:italic;font-size:13px;color:rgba(242,239,232,.64)}
.note{font-style:italic;font-size:13px;line-height:18px;color:rgba(242,239,232,.64)}
.pills{position:absolute;left:18px;right:18px;bottom:30px;display:flex;gap:8px}
.pill{font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:15px;line-height:18px;padding:13px 22px;border-radius:999px;border:1px solid rgba(242,239,232,.28)}
.pill.filled{background:#F2EFE8;color:#0B0B0A;border-color:#F2EFE8}
.window{background:radial-gradient(ellipse 30% 18% at 70% 38%,rgba(255,196,120,.85),transparent 70%),radial-gradient(ellipse 18% 10% at 30% 55%,rgba(255,170,90,.6),transparent 70%),linear-gradient(180deg,#141a2b 0%,#1d2440 45%,#2b2230 70%,#0f0d12 100%)}
.page{position:absolute;inset:0;padding:48px 18px 0}
.words{margin-top:22px;font-style:italic;font-weight:350;font-size:30px;line-height:36px;letter-spacing:-.015em}
.imprint{margin-top:20px;font-size:16px;line-height:20px}
.imprint i{color:rgba(242,239,232,.64)}
.seam{height:1px;background:#2C2A27;margin:18px 0}
.media{width:100%;aspect-ratio:16/9;border-radius:2px}
</style></head><body><div class="counter">4 of 12</div><div class="page">
<p class="note">post · yesterday</p>
<p class="words">Night trains are back because airports got worse, not because trains got better. A sleeper leaves from the middle of one city and wakes you in the middle of the next. The bed is the time saving.</p>
<p class="imprint">Tom Hale <i>@tomhale</i></p>
<div class="seam"></div>
<div class="media window"></div>
</div><div class="pills"><span class="pill filled">Move</span><span class="pill">Open</span></div></body></html>
