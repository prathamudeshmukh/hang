# Stock Android 11 emulator: Chrome's ⋮ menu → Share… → the system share sheet → Hang.
appId: com.android.chrome
---
- openLink:
    link: ${URL}
    browser: true
- runFlow: chrome-first-run.yaml
- extendedWaitUntil:
    visible: Example Domain
    timeout: 30000
- runFlow: open-chrome-share.yaml
- extendedWaitUntil:
    visible: Hang
    timeout: 10000
- tapOn: Hang
- runFlow: leave-in-inbox.yaml
