# Tests on every push to main and on PRs. On main, deploys what changed under supabase/ once the tests pass:
# migrations first, then functions. Runtime secrets (EXTRACT_SECRET, Vault) are set by hand, never here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DENO_VERSION: "2.9.6"
  SUPABASE_CLI_VERSION: "3.1.0"
  SUPABASE_PROJECT_REF: ffofgzyudtloekityjfw
  # Services the tests don't use. Realtime, storage, auth, PostgREST and Kong stay up; the functions'
  # integration script serves its own edge runtime.
  SUPABASE_START_EXCLUDE: studio,imgproxy,mailpit,logflare,vector,supavisor,postgres-meta,edge-runtime

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'
            functions:
              - 'supabase/functions/**'
              - '!supabase/functions/**/*.test.ts'
              - '!supabase/functions/**/*.integration.ts'
              - '!supabase/functions/scripts/**'
          predicate-quantifier: every

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      # Global install so the scripts' `npx supabase` resolves to this pinned version.
      - name: Supabase CLI
        run: |
          npm install -g "supabase@$SUPABASE_CLI_VERSION"
          npx supabase --version

      - name: App — install
        working-directory: app
        run: npm ci
      - name: App — typecheck
        working-directory: app
        run: npm run typecheck
      - name: App — lint
        working-directory: app
        run: npm run lint
      - name: App — unit tests with coverage
        working-directory: app
        run: npm run test:coverage

      - name: Functions — typecheck
        working-directory: supabase/functions
        run: deno task check
      - name: Functions — lint
        working-directory: supabase/functions
        run: deno lint
      - name: Functions — unit tests with coverage
        working-directory: supabase/functions
        run: deno task test:coverage

      - name: Local stack — start
        run: npx supabase start -x "$SUPABASE_START_EXCLUDE"
      - name: Database — pgTAP
        run: npx supabase test db
      - name: Functions — integration
        working-directory: supabase/functions
        run: deno task test:integration
      - name: App — integration
        working-directory: app
        run: npm run test:integration

  migrate:
    needs: [changes, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Plan
        run: supabase db push --dry-run
      - name: Push
        run: supabase db push

  deploy-functions:
    needs: [changes, test, migrate]
    # Runs after migrate, or when migrate was skipped; never after a failed migrate.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.test.result == 'success' && needs.changes.outputs.functions == 'true'
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-functions
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
